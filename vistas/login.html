<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../imagenes/widiLogoRedondo.png"
    />

    <!-- Estilos -->
    <link rel="stylesheet" href="../css/estilos.css" />

    <!-- Bootstrap icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />

    <!-- Script del tema -->
    <script src="../js/theme.js" defer></script>
</head>
  <body>
    <header class="bg-dark text-white p-3">
      <div class="container d-flex align-items-center justify-content-between">
        <!-- Logo + título -->
        <div class="d-flex align-items-center">
          <img
            src="../imagenes/widiLogoRedondo.png"
            alt="Logo Widi Store"
            width="50"
            class="me-2"
          />
          <h1 class="h4 mb-0">WIDISTORE</h1>
        </div>

        <!-- Navbar -->
        <nav>
          <ul class="nav">
            <li class="nav-item">
              <a class="nav-link text-white" href="index.html">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white" href="productos.html">Productos</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white" href="carrito.html">Carrito</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white" href="ticket.html">Ticket</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="container my-5">
      <h2 class="text-center mb-4">Login Administrador</h2>
      <form id="login-form" class="mx-auto" style="max-width: 400px">
        <div class="mb-3">
          <label for="username" class="form-label">Correo</label>
          <input type="email" class="form-control" id="email" required />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="password" required />
        </div>
        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
      </form>
    </main>

    <footer
      class="d-flex justify-content-center align-items-center bg-dark text-white p-3 fixed-bottom"
    >
      <p>Realizado por Guadalupe Festinese y Bogdana Davydenkova</p>
    </footer>

    <!-- Script Bootstrap -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>

    <script src="../js/login.js"></script>

  </body>
</html>
